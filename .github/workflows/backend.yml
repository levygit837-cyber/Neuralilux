name: Backend

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      # Sem segredos nem serviços: os testes rodam em SQLite.
      - name: Testes (paralelo, sem e2e)
        run: python -m pytest tests --ignore=tests/e2e -q -p no:cacheprovider -n auto

      - name: Ruff (pyflakes)
        run: ruff check --select F app

      # `alembic heads` só lê os scripts; a URL é exigida pelo env.py, mas nada conecta.
      - name: Alembic com uma única head
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          heads=$(alembic heads)
          echo "$heads"
          test "$(echo "$heads" | grep -c '(head)')" -eq 1

      - name: Nenhum .py de app/ acima de 400 linhas
        run: python scripts/check_max_lines.py

      # pip-audit fica fora do requirements-dev.txt: arrasta dependências próprias que não devem
      # entrar no ambiente de teste. As duas exceções não têm versão corrigida no PyPI:
      # PYSEC-2026-4298 (python-jose) só é explorável com `algorithms` irrestrito ou chave pública
      # como segredo HMAC; `app/core/security.py` fixa HS256 com SECRET_KEY simétrica.
      # PYSEC-2026-1325 (ecdsa) é timing na assinatura ECDSA, que o app não usa (só HS256).
      # Reavaliar quando sair uma versão corrigida.
      - name: Auditoria de dependências (pip-audit)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-4298 --ignore-vuln PYSEC-2026-1325

  # Migrações e queries reais em Postgres (mesma major do docker-compose.example.yml). Bloco próprio: a suíte
  # SQLite do job acima continua sem serviços.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: neuralilux_ci
          POSTGRES_PASSWORD: neuralilux_ci
          POSTGRES_DB: neuralilux_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuralilux_ci -d neuralilux_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Servidor de teste; os testes criam e apagam bancos próprios nele. Nunca a DATABASE_URL de dev.
      TEST_POSTGRES_URL: postgresql://neuralilux_ci:neuralilux_ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Alembic upgrade head, downgrade base, upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://neuralilux_ci:neuralilux_ci@localhost:5432/neuralilux_ci
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      # Models x schema migrado (autogenerate) e queries só de Postgres (FTS, índice parcial do Payment Record, to_char).
      - name: Testes Postgres
        run: python -m pytest tests/postgres -m postgres -q -p no:cacheprovider
