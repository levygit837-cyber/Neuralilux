# Infra local de desenvolvimento: PostgreSQL, Redis, RabbitMQ e Evolution API.
#
# O docker-compose.yml real é local e ignorado pelo git (pode ter credenciais suas). Este arquivo é o
# modelo versionado: copie-o e suba com as variáveis do backend/.env.
#
#   cp docker-compose.example.yml docker-compose.yml
#   docker compose --env-file backend/.env up -d     # sempre com --env-file; sem ele o compose recusa subir
#
# Senhas e portas abaixo são defaults de DESENVOLVIMENTO, os mesmos de backend/.env.example. Não use em produção.
# EVOLUTION_DB_PASSWORD (opcional): senha do usuário `evolution` no Postgres, lida pelo script de init e pela URI da
# Evolution. Entra numa URI: use só letras, dígitos, `-` e `_`. O init roda só na criação do volume do Postgres.
# Obrigatórias no backend/.env: EVOLUTION_API_KEY e EVOLUTION_WEBHOOK_TOKEN (o compose recusa subir sem elas).
# A API e o worker rodam no host, fora deste compose (veja docs/setup.md).
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    environment:
      - POSTGRES_USER=neuralilux
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-neuralilux_password}
      - POSTGRES_DB=neuralilux
      - POSTGRES_MULTIPLE_DATABASES=evolution # o script cria o banco e o usuário da Evolution
      - EVOLUTION_DB_PASSWORD=${EVOLUTION_DB_PASSWORD:-} # vazio: o script usa o default de dev (precisa casar com a URI da Evolution)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuralilux"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password} # o healthcheck lê a senha do ambiente do container
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-redis_password} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=neuralilux
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-rabbitmq_password}
      - RABBITMQ_DEFAULT_VHOST=neuralilux
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    ports:
      - "${EVOLUTION_PORT:-8081}:8080"
    environment:
      - SERVER_TYPE=http
      - SERVER_URL=http://localhost:${EVOLUTION_PORT:-8081}
      - SERVER_PORT=8080

      # Banco próprio da Evolution, criado por scripts/init-multiple-databases.sh (mesma senha de dev do script).
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_PASSWORD:-Ev0lution_S3cur3_P%40ssw0rd%21}@postgres:5432/evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_LABELS=true

      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=true
      - CACHE_LOCAL_ENABLED=false

      # O mesmo valor de EVOLUTION_API_KEY do backend/.env.
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY em backend/.env}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=false

      # Webhook (ADR 0006). O token vai na query string; EVOLUTION_WEBHOOK_TOKEN é o mesmo de backend/.env.
      - WEBHOOK_GLOBAL_ENABLED=true
      # BY_EVENTS=false: o evento já vem em payload.event (por quê: docs/setup.md, seção 2).
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_GLOBAL_URL=http://host.docker.internal:8000/api/v1/webhooks/evolution?token=${EVOLUTION_WEBHOOK_TOKEN:?defina EVOLUTION_WEBHOOK_TOKEN em backend/.env}
      # Eventos do webhook (docs/agents/evolution-data-formats.md). A Evolution só entrega o que estiver `true`; sem
      # estas variáveis valem os defaults da imagem, que ligam quase tudo. Ligados: os que o consumer trata
      # (messages.upsert/update, connection.update, qrcode.updated e os de importação de histórico).
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_MESSAGES_SET=true
      - WEBHOOK_EVENTS_CHATS_SET=true
      - WEBHOOK_EVENTS_CONTACTS_SET=true
      - WEBHOOK_EVENTS_CHATS_UPSERT=true
      # Desligados: o consumer não os trata e cairiam em "Unknown webhook event". Ligue um e trate-o em
      # consumer.process_webhook_event se precisar (ex.: contacts.update para atualizar nomes).
      - WEBHOOK_EVENTS_MESSAGES_EDITED=false
      - WEBHOOK_EVENTS_MESSAGES_DELETE=false
      - WEBHOOK_EVENTS_SEND_MESSAGE=false
      - WEBHOOK_EVENTS_SEND_MESSAGE_UPDATE=false
      - WEBHOOK_EVENTS_CONTACTS_UPSERT=false
      - WEBHOOK_EVENTS_CONTACTS_UPDATE=false
      - WEBHOOK_EVENTS_PRESENCE_UPDATE=false
      - WEBHOOK_EVENTS_CHATS_UPDATE=false
      - WEBHOOK_EVENTS_CHATS_DELETE=false
      - WEBHOOK_EVENTS_GROUPS_UPSERT=false
      - WEBHOOK_EVENTS_GROUPS_UPDATE=false
      - WEBHOOK_EVENTS_GROUP_PARTICIPANTS_UPDATE=false
      - WEBHOOK_EVENTS_LABELS_EDIT=false
      - WEBHOOK_EVENTS_LABELS_ASSOCIATION=false
      - WEBHOOK_EVENTS_CALL=false
      - WEBSOCKET_ENABLED=true
      - WEBSOCKET_GLOBAL_EVENTS=true
      - WEBSOCKET_ALLOWED_HOSTS=*

      - LOG_LEVEL=ERROR,WARN,INFO
      - LOG_COLOR=false
      - LOG_BAILEYS=error
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#198754
      # Versão do WhatsApp/Baileys; sem ela o QR code pode não ser gerado.
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1037082622
      - DEL_INSTANCE=false
      - TELEMETRY=false
      - LANGUAGE=pt
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  evolution_instances:
  evolution_store:
